# =============================================================================
# Secret — identifiants PostgreSQL
#
# Un Secret stocke des donnees sensibles (mots de passe, tokens). Kubernetes
# les expose aux pods soit comme variables d'environnement, soit comme fichiers.
#
# ATTENTION pedagogique : un Secret K8s n'est PAS chiffre par defaut, juste
# encode en base64 dans etcd. Pour de la vraie prod on utiliserait Sealed
# Secrets / External Secrets / un coffre (Vault). Ici, en dev local, on met le
# mot de passe en clair via `stringData` (K8s l'encode en base64 tout seul).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: walletdigital
  POSTGRES_PASSWORD: changeme_pg
