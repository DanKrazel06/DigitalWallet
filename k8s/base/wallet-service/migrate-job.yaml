# Job — migration Prisma du wallet-service (cf. tx-service pour les details).
apiVersion: batch/v1
kind: Job
metadata:
  name: wallet-service-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: wallet-service
        role: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: walletdigital/wallet-service-migrate:dev
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wallet-service-secret
                  key: DATABASE_URL
