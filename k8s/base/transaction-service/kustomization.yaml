# Kustomization du transaction-service.
# Regroupe config, secret, job de migration, deployment et service en une unite
# applicable d'un coup via : kubectl apply -k k8s/base/transaction-service
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - secret.yaml
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml
