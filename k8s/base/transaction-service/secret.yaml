# =============================================================================
# Secret — DATABASE_URL du transaction-service
#
# La chaine de connexion contient le mot de passe Postgres -> donnee sensible,
# donc Secret (pas ConfigMap).
#
# Decomposition de l'URL :
#   postgresql://walletdigital:changeme_pg@postgres:5432/transaction?schema=public
#                ^user        ^password    ^hote DNS ^port ^base    ^schema
#
# L'hote est "postgres" (le Service K8s), port 5432 (interne au cluster) — fini
# le port 5433 du dev local. La base "transaction" a ete creee par le script
# d'init de Postgres (etape 2).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: transaction-service-secret
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://walletdigital:changeme_pg@postgres:5432/transaction?schema=public'
