# Deployment — merchant-service (stateless, cf. tx-service pour les details).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchant-service
  template:
    metadata:
      labels:
        app: merchant-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: merchant-service
          image: walletdigital/merchant-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - configMapRef:
                name: merchant-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: merchant-service-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
