# pg_hba.conf for local development only.
# DO NOT use this in production: it disables password authentication for
# host-network connections. Production should use scram-sha-256 + TLS.

# Local Unix-socket connections inside the container.
local   all             all                                     trust

# Loopback IPv4/IPv6 inside the container.
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Replication (unused locally).
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# Any other connection (e.g. from the Docker host / other containers in the
# bridge network). Uses md5 instead of scram-sha-256 to work around a known
# SCRAM auth issue with Docker Desktop on Windows port-forwarding.
host    all             all             0.0.0.0/0               md5
host    all             all             ::/0                    md5
